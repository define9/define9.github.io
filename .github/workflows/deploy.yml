name: Build and deploy

# 按 Zola 官方推荐：Pages Artifacts + actions/deploy-pages
# https://www.getzola.org/documentation/deployment/github-pages/
# 与官方 getzola/github-pages 流程一致，只是把「build → 上传」拆开，
# 中间插了一步 Pagefind 生成 /search/ 用的索引。

env:
  ZOLA_VERSION: 0.23.6
  PAGEFIND_VERSION: 1.5.2
  TZ: Asia/Shanghai

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Zola
        run: |
          echo "Installing Zola ${ZOLA_VERSION}..."
          curl -sfL --output-dir "${RUNNER_TEMP}" -O \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -C "${HOME}/.local" -xzf "${RUNNER_TEMP}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz" zola
          echo "${HOME}/.local" >> "${GITHUB_PATH}"

      - name: Install Pagefind
        run: |
          echo "Installing Pagefind ${PAGEFIND_VERSION}..."
          curl -sfL --output-dir "${RUNNER_TEMP}" -O \
            "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-linux-x64.tar.gz"
          mkdir -p "${HOME}/.local/pagefind"
          tar -C "${HOME}/.local/pagefind" -xzf "${RUNNER_TEMP}/pagefind-v${PAGEFIND_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/pagefind" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          zola --version
          pagefind --version

      - name: Check content and links
        run: zola check

      - name: Build
        # 不能加 --minify：Zola 0.23 的压缩器会把属性引号去掉，Pagefind 解析不了
        run: zola build

      - name: Build search index
        run: pagefind --site public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5