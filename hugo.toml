baseURL = 'https://example.org/'
locale = 'zh-CN'
title = 'define9 notes'

[module]
[[module.imports]]
path = "github.com/privatemaker/headless-cms"

[[module.imports]]
path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[outputs]
home = ["HTML", "RSS", "HeadlessCMSConfig"]

[security]
  [security.http]
    methods = ["GET", "POST"]
    proxyFromEnvironment = false
    # 允许 unpkg.com
    urls = [
      "^https://unpkg.com/",
      "(?i)^https?://[a-z0-9]",
      "! (?i)^https?://\\d+\\.",
      "! (?i)localhost",
      "! (?i)^https?://[^/?#]*@"
    ]
