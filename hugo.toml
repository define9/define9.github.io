baseURL = 'https://define9.github.io/'
locale = 'zh-CN'
title = 'define9 notes'

[module]
[[module.imports]]
path = "github.com/privatemaker/headless-cms"

[[module.imports]]
path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[outputs]
home = ["HTML", "RSS", "HeadlessCMSConfig"]

# 图片缓存跟随 --cacheDir，避免落在项目目录的 resources/ 里
# https://gohugo.io/host-and-deploy/host-on-github-pages/ Step 3
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[security]
  [security.http]
    methods = ["GET", "POST"]
    proxyFromEnvironment = false
    # 允许 unpkg.com
    urls = [
      "^https://unpkg.com/",
      "(?i)^https?://[a-z0-9]",
      "! (?i)^https?://\\d+\\.",
      "! (?i)localhost",
      "! (?i)^https?://[^/?#]*@"
    ]
